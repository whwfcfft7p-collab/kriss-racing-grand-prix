<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kriss Racing Grand Prix</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0b0b;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .screen {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            text-align: center;
        }

        .top-line {
            position: absolute;
            top: 35px;
            left: 45px;
            right: 45px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            letter-spacing: 3px;
            color: #888;
        }

        .team {
            font-size: 14px;
            letter-spacing: 6px;
            color: #ff8700;
            font-weight: bold;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(55px, 9vw, 120px);
            line-height: 0.85;
            letter-spacing: -5px;
            font-weight: 900;
            text-transform: uppercase;
        }

        h1 span {
            color: #ff8700;
        }

        .subtitle {
            margin-top: 30px;
            font-size: 13px;
            letter-spacing: 5px;
            color: #aaa;
            text-transform: uppercase;
        }

        .driver {
            margin-top: 55px;
            font-size: 12px;
            letter-spacing: 4px;
            color: #777;
        }

        .driver strong {
            color: white;
            font-size: 18px;
            letter-spacing: 3px;
        }

        .button {
            margin-top: 40px;
            padding: 18px 45px;
            border: 1px solid #ff8700;
            background: transparent;
            color: white;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.25s;
        }

        .button:hover {
            background: #ff8700;
            color: #0b0b0b;
        }

        .bottom {
            position: absolute;
            bottom: 30px;
            font-size: 9px;
            letter-spacing: 3px;
            color: #555;
        }

        .track {
            position: absolute;
            width: 600px;
            height: 600px;
            border: 1px solid #181818;
            border-radius: 50%;
            z-index: -1;
        }

        .track::before {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            border: 1px solid #151515;
            border-radius: 50%;
            top: 89px;
            left: 89px;
        }
    </style>
</head>

<body>

    <main class="screen">

        <div class="top-line">
            <div>KRISS RACING TEAM</div>
            <div>GRAND PRIX 2026</div>
        </div>

        <div class="track"></div>

        <div class="team">
            MCLAREN DIVISION
        </div>

        <h1>
            KRISS<br>
            <span>RACING</span>
        </h1>

        <div class="subtitle">
            Grand Prix 2026
        </div>

        <div class="driver">
            DRIVER<br><br>
            <strong>LAUR</strong>
        </div>

        <button class="button" onclick="enterPaddock()">
            ENTER PADDOCK
        </button>

        <div class="bottom">
            RACE CONTROL • DRIVER ACCESS SYSTEM
        </div>

    </main>

    <script>
        function enterPaddock() {
            alert("Paddock access system coming online...");
        }
    </script>

</body>
</html>
