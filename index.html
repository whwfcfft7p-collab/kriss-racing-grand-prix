<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kriss Racing Grand Prix</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0b0b;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        .screen {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            text-align: center;
        }

        .top-line {
            position: absolute;
            top: 35px;
            left: 45px;
            right: 45px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            letter-spacing: 3px;
            color: #888;
        }

        .team {
            font-size: 14px;
            letter-spacing: 6px;
            color: #ff8700;
            font-weight: bold;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(55px, 9vw, 120px);
            line-height: 0.85;
            letter-spacing: -5px;
            font-weight: 900;
            text-transform: uppercase;
        }

        h1 span {
            color: #ff8700;
        }

        .subtitle {
            margin-top: 30px;
            font-size: 13px;
            letter-spacing: 5px;
            color: #aaa;
            text-transform: uppercase;
        }

        .driver {
            margin-top: 55px;
            font-size: 12px;
            letter-spacing: 4px;
            color: #777;
        }

        .driver strong {
            color: white;
            font-size: 18px;
            letter-spacing: 3px;
        }

        .button {
            margin-top: 40px;
            padding: 18px 45px;
            border: 1px solid #ff8700;
            background: transparent;
            color: white;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.25s;
        }

        .button:hover {
            background: #ff8700;
            color: #0b0b0b;
        }

        .bottom {
            position: absolute;
            bottom: 30px;
            font-size: 9px;
            letter-spacing: 3px;
            color: #555;
        }

        .track {
            position: absolute;
            width: 600px;
            height: 600px;
            border: 1px solid #181818;
            border-radius: 50%;
            z-index: -1;
        }

        .track::before {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            border: 1px solid #151515;
            border-radius: 50%;
            top: 89px;
            left: 89px;
        }

        /* LEVEL 0 */

        .registration {
            width: min(700px, 90%);
            text-align: center;
        }

        .level {
            color: #ff8700;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 25px;
        }

        h2 {
            font-size: clamp(45px, 7vw, 85px);
            line-height: 0.9;
            letter-spacing: -3px;
            font-weight: 900;
            text-transform: uppercase;
        }

        h2 span {
            color: #ff8700;
        }

        .intro {
            margin-top: 30px;
            color: #999;
            font-size: 14px;
            line-height: 1.8;
            letter-spacing: 1px;
        }
                #questionNumber {
            margin-top: 35px;
            margin-bottom: 20px;
            font-size: 11px;
            letter-spacing: 4px;
            color: #666;
        }

        #question {
            font-size: clamp(24px, 4vw, 42px);
            line-height: 1.15;
            letter-spacing: -1px;
            margin-bottom: 35px;
        }

        #answers {
            width: min(600px, 90%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .answer {
            padding: 18px 20px;
            border: 1px solid #333;
            background: #111;
            color: white;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
        }

        .answer:hover {
            border-color: #ff8700;
            background: #ff8700;
            color: #0b0b0b;
        }

        #feedback {
            margin-top: 25px;
            min-height: 20px;
            color: #ff4d4d;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        @media (max-width: 600px) {

            #answers {
                grid-template-columns: 1fr;
            }

            .top-line {
                left: 20px;
                right: 20px;
            }

            h2 {
                font-size: 45px;
            }

        }
                .race-info {
            width: min(650px, 90%);
            margin: 25px auto 35px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border: 1px solid #222;
            background: #101010;
        }

        .race-info div {
            padding: 16px 10px;
            border-right: 1px solid #222;
        }

        .race-info div:last-child {
            border-right: none;
        }

        .race-info span {
            display: block;
            font-size: 8px;
            letter-spacing: 2px;
            color: #666;
            margin-bottom: 8px;
        }

        .race-info strong {
            font-size: 15px;
            letter-spacing: 1px;
        }

        #fuel-options {
            width: min(650px, 90%);
            margin: 30px auto 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .fuel-option {
            padding: 20px;
            border: 1px solid #333;
            background: #111;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .fuel-option:hover {
            border-color: #ff8700;
            background: #ff8700;
            color: #0b0b0b;
            transform: translateY(-2px);
        }

        .fuel-option strong {
            display: block;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .fuel-option span {
            font-size: 9px;
            letter-spacing: 2px;
            color: #777;
        }

        .fuel-option:hover span {
            color: #0b0b0b;
        }

        #fuel-feedback {
            min-height: 100px;
            margin-top: 25px;
        }

        .fuel-result {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .fuel-result small {
            display: block;
            margin-top: 10px;
            color: #777;
            font-size: 10px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .danger {
            color: #ff4d4d;
        }

        .warning {
            color: #ff8700;
        }

        .perfect {
            color: #7cff7c;
        }

        .continue-button {
            margin-top: 25px;
        }

        .reward {
            margin-top: 35px;
            color: #ff8700;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .reward-text {
            margin-top: 12px;
            color: #666;
            font-size: 11px;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {

            .race-info {
                grid-template-columns: 1fr;
            }

            .race-info div {
                border-right: none;
                border-bottom: 1px solid #222;
            }

            .race-info div:last-child {
                border-bottom: none;
            }

            #fuel-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        function enterPaddock() {

                        driver identity must be verified.
                    </p>

                    <button class="button" onclick="startRegistration()">
                        BEGIN VERIFICATION
                    </button>

                </div>

                <div class="bottom">
                    RACE CONTROL • DRIVER ACCESS SYSTEM
                </div>

            `;
        }

     function startRegistration() {

    document.querySelector(".screen").innerHTML = `

            <div id="questionNumber"></div>

            <h2 id="question"></h2>

            <div id="answers"></div>

            <div id="feedback"></div>

        </div>

        <div class="bottom">
            RACE CONTROL • DRIVER ACCESS SYSTEM
        </div>

    `;

    showQuestion();
}
        let currentQuestion = 0;

const questions = [
    {
        question: "Care este mașina cu care ai înnebunit-o pe Kriss?",
        answers: [
            "BMW M3",
            "Porsche 911 GT3 RS",
            "Nissan GT-R",
            "Audi R8"
        ],
        correct: 1
    },

    {
        question: "Care este marca și modelul mașinii tale actuale?",
        answers: [
            "Opel Astra",
            "Volkswagen Passat",
            "Opel Insignia",
            "BMW Seria 3"
        ],
        correct: 2
    },

    {
        question: "Care este porecla ta?",
        answers: [
            "The Driver",
            "Sniper-ul",
            "Boss",
            "Speedy"
        ],
        correct: 1
    },

    {
        question: "La ce serial te-ai uitat de cel puțin 3 ori?",

            "Breaking Bad",
            "Prison Break",
            "Lucifer",
            "Peaky Blinders"

        correct: 2

    {
        question: "Care este unul dintre cele mai cunoscute inside joke-uri ale noastre?",
        answers: [
            "Unde e cheia?",
            "Mă doare Tomasul",
            "Hai la McDonald's",
            "Nu mai pornește mașina"
        ],
        correct: 1
    }
];

function showQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").innerHTML =
        "QUESTION " + (currentQuestion + 1) + " / " + questions.length;

    document.getElementById("question").innerHTML =
        q.question;

    const answersContainer = document.getElementById("answers");

    answersContainer.innerHTML = "";

    q.answers.forEach((answer, index) => {

        const button = document.createElement("button");

        button.className = "answer";
        button.innerHTML = answer;

        button.onclick = function() {
            checkAnswer(index);
        };

        answersContainer.appendChild(button);

    });
}

function checkAnswer(selected) {

    const q = questions[currentQuestion];

    if (selected === q.correct) {

        currentQuestion++;

        if (currentQuestion < questions.length) {

            showQuestion();

        } else {

            completeRegistration();

        }

    } else {

        document.getElementById("feedback").innerHTML =
            "✕ WRONG ANSWER — TRY AGAIN";

    }
}

function completeRegistration() {

    document.querySelector(".screen").innerHTML = `

        <div class="top-line">
            <div>KRISS RACING TEAM</div>
            <div>DRIVER VERIFIED</div>
        </div>

}

            RACE CONTROL • LEVEL 01 • FUEL
        </div>

    `;
}
        function checkFuel(amount) {

    const feedback = document.getElementById("fuel-feedback");

    if (amount === 30) {

        feedback.innerHTML = `
            <div class="fuel-result danger">
                ✕ FUEL DEPLETED
                <small>Driver ran out of fuel before the finish.</small>
            </div>
        `;

    } else if (amount === 43.2) {

        feedback.innerHTML = `
            <div class="fuel-result perfect">
                ✓ OPTIMAL FUEL LOAD
                <small>Perfect calculation. Maximum efficiency.</small>
            </div>

            <button class="button continue-button" onclick="completeFuelLevel()">
                COMPLETE LEVEL
            </button>
        `;

    } else {

        feedback.innerHTML = `
            <div class="fuel-result warning">
                ⚠ HEAVY CAR
                <small>You can finish the race, but you're carrying unnecessary weight.</small>
            </div>
        `;
    }
}
        function completeFuelLevel() {

    document.querySelector(".screen").innerHTML = `

}

function showBuildStep() {

    const step = buildOptions[currentBuildStep];

    document.getElementById("build-step").innerHTML =
        (currentBuildStep + 1) + " / " + buildOptions.length;

    document.getElementById("build-progress-bar").style.width =
        ((currentBuildStep + 1) / buildOptions.length * 100) + "%";

    document.getElementById("build-content").innerHTML = `

        <div class="build-category">
            ${step.name}
        </div>

        <h3 class="build-question">
            ${step.question}
        </h3>

        <div class="build-options">

            ${step.options.map((option, index) => `

                <button
                    class="build-option"
                    onclick="selectBuildOption(${index})"
                >

                    <strong>${option.name}</strong>

                    <span>${option.description}</span>

                </button>

            `).join("")}

        </div>

    `;

    document.getElementById("build-feedback").innerHTML = "";
}


function selectBuildOption(index) {

    const selected = buildOptions[currentBuildStep].options[index];

    buildChoices[currentBuildStep] = selected;

    currentBuildStep++;

    if (currentBuildStep < buildOptions.length) {

        showBuildStep();

    } else {

        showBuildResult();

    }
}


function showBuildResult() {

    let power = 0;
    let handling = 0;
    let braking = 0;
    let aero = 0;
    let style = 0;

    buildChoices.forEach(choice => {

        power += choice.power;
        handling += choice.handling;
        braking += choice.braking;
        aero += choice.aero;
        style += choice.style;

    });

    power = Math.min(power, 10);
    handling = Math.min(handling, 10);
    braking = Math.min(braking, 10);
    aero = Math.min(aero, 10);
    style = Math.min(style, 10);

    document.querySelector(".screen").innerHTML = `

        <div class="top-line">
            <div>KRISS RACING TEAM</div>
            <div>BUILD COMPLETE</div>
        </div>

        <div class="registration">

            <div class="level">
                LEVEL 2 • BUILD COMPLETE
            </div>

            <h2>
                YOUR CAR<br>
                <span>IS READY ✓</span>
            </h2>

            <div class="car-name">
                KRISS RACING MACHINE #01
            </div>

            <div class="stats">

                <div class="stat">
                    <span>POWER</span>
                    <div class="stat-bar">
                        <div style="width:${power * 10}%"></div>
                    </div>
                    <strong>${power}/10</strong>
                </div>

                <div class="stat">
                    <span>HANDLING</span>
                    <div class="stat-bar">
                        <div style="width:${handling * 10}%"></div>
                    </div>
                    <strong>${handling}/10</strong>
                </div>

                <div class="stat">
                    <span>BRAKING</span>
                    <div class="stat-bar">
                        <div style="width:${braking * 10}%"></div>
                    </div>
                    <strong>${braking}/10</strong>
                </div>

                <div class="stat">
                    <span>AERO</span>
                    <div class="stat-bar">
                        <div style="width:${aero * 10}%"></div>
                    </div>
                    <strong>${aero}/10</strong>
                </div>

                <div class="stat">
                    <span>STYLE</span>
                    <div class="stat-bar">
                        <div style="width:${style * 10}%"></div>
                    </div>
                    <strong>${style}/10</strong>
                </div>

            </div>

            <div class="reward">
                DRIVER REWARD UNLOCKED
            </div>

            <p class="reward-text">
                Your personalized keychain is ready.
            </p>

            <button class="button" onclick="goToLevel3()">
                NEXT LEVEL
            </button>

        </div>

        <div class="bottom">
            RACE CONTROL • LEVEL 02 CLEARED
        </div>

    `;
}


function goToLevel3() {

    document.querySelector(".screen").innerHTML = `

        <div class="top-line">
            <div>KRISS RACING TEAM</div>
            <div>GRAND PRIX 2026</div>
        </div>

        <div class="registration">

            <div class="level">
                LEVEL 3
            </div>

            <h2>
                TYRE<br>
                <span>STRATEGY</span>
            </h2>

            <p class="intro">
                Weather is changing.<br>
                Choose the right tyres for the conditions.
            </p>

            <button class="button">
                START LEVEL
            </button>

        </div>

        <div class="bottom">
            RACE CONTROL • LEVEL 03 • TYRES
        </div>

    `;
}
    </script>
