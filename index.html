<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kriss Racing Grand Prix</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0b0b;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .screen {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            text-align: center;
        }

        .top-line {
            position: absolute;
            top: 35px;
            left: 45px;
            right: 45px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            letter-spacing: 3px;
            color: #888;
        }

        .team {
            font-size: 14px;
            letter-spacing: 6px;
            color: #ff8700;
            font-weight: bold;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(55px, 9vw, 120px);
            line-height: 0.85;
            letter-spacing: -5px;
            font-weight: 900;
            text-transform: uppercase;
        }

        h1 span {
            color: #ff8700;
        }

        .subtitle {
            margin-top: 30px;
            font-size: 13px;
            letter-spacing: 5px;
            color: #aaa;
            text-transform: uppercase;
        }

        .driver {
            margin-top: 55px;
            font-size: 12px;
            letter-spacing: 4px;
            color: #777;
        }

        .driver strong {
            color: white;
            font-size: 18px;
            letter-spacing: 3px;
        }

        .button {
            margin-top: 40px;
            padding: 18px 45px;
            border: 1px solid #ff8700;
            background: transparent;
            color: white;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.25s;
        }

        .button:hover {
            background: #ff8700;
            color: #0b0b0b;
        }

        .bottom {
            position: absolute;
            bottom: 30px;
            font-size: 9px;
            letter-spacing: 3px;
            color: #555;
        }

        .track {
            position: absolute;
            width: 600px;
            height: 600px;
            border: 1px solid #181818;
            border-radius: 50%;
            z-index: -1;
        }

        .track::before {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            border: 1px solid #151515;
            border-radius: 50%;
            top: 89px;
            left: 89px;
        }

        /* LEVEL 0 */

        .registration {
            width: min(700px, 90%);
            text-align: center;
        }

        .level {
            color: #ff8700;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 25px;
        }

        h2 {
            font-size: clamp(45px, 7vw, 85px);
            line-height: 0.9;
            letter-spacing: -3px;
            font-weight: 900;
            text-transform: uppercase;
        }

        h2 span {
            color: #ff8700;
        }

        .intro {
            margin-top: 30px;
            color: #999;
            font-size: 14px;
            line-height: 1.8;
            letter-spacing: 1px;
        }
                #questionNumber {
            margin-top: 35px;
            margin-bottom: 20px;
            font-size: 11px;
            letter-spacing: 4px;
            color: #666;
        }

        #question {
            font-size: clamp(24px, 4vw, 42px);
            line-height: 1.15;
            letter-spacing: -1px;
            margin-bottom: 35px;
        }

        #answers {
            width: min(600px, 90%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .answer {
            padding: 18px 20px;
            border: 1px solid #333;
            background: #111;
            color: white;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
        }

        .answer:hover {
            border-color: #ff8700;
            background: #ff8700;
            color: #0b0b0b;
        }

        #feedback {
            margin-top: 25px;
            min-height: 20px;
            color: #ff4d4d;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        @media (max-width: 600px) {

            #answers {
                grid-template-columns: 1fr;
            }

            .top-line {
                left: 20px;
                right: 20px;
            }

            h2 {
                font-size: 45px;
            }

        }
                .race-info {
            width: min(650px, 90%);
            margin: 25px auto 35px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border: 1px solid #222;
            background: #101010;
        }

        .race-info div {
            padding: 16px 10px;
            border-right: 1px solid #222;
        }

        .race-info div:last-child {
            border-right: none;
        }

        .race-info span {
            display: block;
            font-size: 8px;
            letter-spacing: 2px;
            color: #666;
            margin-bottom: 8px;
        }

        .race-info strong {
            font-size: 15px;
            letter-spacing: 1px;
        }

        #fuel-options {
            width: min(650px, 90%);
            margin: 30px auto 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .fuel-option {
            padding: 20px;
            border: 1px solid #333;
            background: #111;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .fuel-option:hover {
            border-color: #ff8700;
            background: #ff8700;
            color: #0b0b0b;
            transform: translateY(-2px);
        }

        .fuel-option strong {
            display: block;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .fuel-option span {
            font-size: 9px;
            letter-spacing: 2px;
            color: #777;
        }

        .fuel-option:hover span {
            color: #0b0b0b;
        }

        #fuel-feedback {
            min-height: 100px;
            margin-top: 25px;
        }

        .fuel-result {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .fuel-result small {
            display: block;
            margin-top: 10px;
            color: #777;
            font-size: 10px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .danger {
            color: #ff4d4d;
        }

        .warning {
            color: #ff8700;
        }

        .perfect {
            color: #7cff7c;
        }

        .continue-button {
            margin-top: 25px;
        }

        .reward {
            margin-top: 35px;
            color: #ff8700;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .reward-text {
            margin-top: 12px;
            color: #666;
            font-size: 11px;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {

            .race-info {
                grid-template-columns: 1fr;
            }

            .race-info div {
                border-right: none;
                border-bottom: 1px solid #222;
            }

            .race-info div:last-child {
                border-bottom: none;
            }

            #fuel-options {
                grid-template-columns: 1fr;
            }
        }
        /* ================================
   KRISS RACING - INTERACTIVE CAR
   ================================ */

.car-build-layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 25px;
    margin-top: 25px;
}

.car-preview-box {
    position: relative;
    min-height: 380px;
    border: 1px solid #333;
    background:
        radial-gradient(circle at 50% 45%, rgba(255,135,0,0.12), transparent 45%),
        linear-gradient(145deg, #151515, #050505);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.car-preview-box::before {
    content: "KRISS RACING MACHINE #01";
    position: absolute;
    top: 18px;
    left: 20px;
    font-size: 11px;
    letter-spacing: 3px;
    color: #777;
}

.car-preview-box::after {
    content: "LIVE CONFIGURATION";
    position: absolute;
    bottom: 15px;
    right: 20px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #ff8700;
}

.car-svg {
    width: 92%;
    max-width: 850px;
    transition: all 0.35s ease;
}

.car-body {
    transition: fill 0.35s ease, filter 0.35s ease;
}

.car-window {
    fill: #080808;
    stroke: #777;
    stroke-width: 2;
}

.car-carbon {
    fill: #101010;
}

.car-light {
    fill: white;
    filter: drop-shadow(0 0 7px white);
}

.car-orange-detail {
    fill: #ff8700;
}

.car-wheel {
    transition: transform 0.35s ease;
}

.car-rim {
    fill: #171717;
    stroke: #888;
    stroke-width: 3;
}

.car-rim-inner {
    fill: none;
    stroke: #555;
    stroke-width: 3;
}

.car-brake {
    fill: #ff8700;
    transition: opacity 0.3s ease;
}

.car-spoiler {
    transition: all 0.3s ease;
}

.car-label {
    font-size: 14px;
    letter-spacing: 3px;
    fill: #fff;
    font-weight: bold;
}

.build-options-new {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.build-option-new {
    padding: 18px 10px;
    min-height: 85px;
    background: #111;
    border: 1px solid #444;
    color: white;
    cursor: pointer;
    transition: 0.2s ease;
    text-align: center;
}

.build-option-new:hover {
    border-color: #ff8700;
    transform: translateY(-2px);
}

.build-option-new.selected {
    border-color: #ff8700;
    background: rgba(255,135,0,0.12);
    box-shadow: 0 0 18px rgba(255,135,0,0.2);
}

.build-option-new strong {
    display: block;
    font-size: 15px;
    margin-bottom: 6px;
}

.build-option-new span {
    display: block;
    font-size: 10px;
    color: #999;
    letter-spacing: 1px;
}

.build-option-new.selected span {
    color: #ff8700;
}

.build-status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    font-size: 12px;
    letter-spacing: 2px;
    color: #888;
}

.build-status strong {
    color: #ff8700;
}

.build-final {
    margin-top: 20px;
    padding: 25px;
    border: 1px solid #ff8700;
    background: rgba(255,135,0,0.05);
}

.build-final-title {
    color: #ff8700;
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 15px;
}

.build-final-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.build-final-item {
    padding: 10px;
    background: #111;
    border: 1px solid #292929;
}

.build-final-item small {
    display: block;
    color: #777;
    font-size: 9px;
    letter-spacing: 2px;
    margin-bottom: 4px;
}

.build-final-item strong {
    font-size: 12px;
}

@media (max-width: 700px) {
    .build-options-new {
        grid-template-columns: repeat(2, 1fr);
    }

    .car-preview-box {
        min-height: 270px;
    }
}
/* =====================================
   KRISS RACING — NIGHT RACE UI
   ===================================== */

:root {
    --bg: #050812;
    --panel: rgba(15, 23, 42, 0.72);
    --panel2: rgba(22, 34, 57, 0.82);
    --line: rgba(129, 230, 255, 0.18);

    --text: #f5f8ff;
    --muted: #8491a8;

    --blue: #4cc9ff;
    --cyan: #76f7ff;
    --lime: #b8ff6a;
    --red: #ff5d73;
}


/* PAGE */

body {
    background:
        radial-gradient(circle at 15% 20%, rgba(76,201,255,0.14), transparent 30%),
        radial-gradient(circle at 85% 75%, rgba(70,90,255,0.13), transparent 32%),
        linear-gradient(135deg, #050812 0%, #080d19 45%, #060a12 100%);

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    overflow-x: hidden;
    overflow-y: auto;
}


/* MOVING GRID */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background-image:
        linear-gradient(rgba(118,247,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(118,247,255,0.035) 1px, transparent 1px);

    background-size: 55px 55px;

    mask-image:
        linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);

    animation: telemetryGrid 12s linear infinite;
}

@keyframes telemetryGrid {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(55px);
    }
}


/* SCREEN */

.screen {
    padding: 95px 30px 80px;
}


/* TOP TELEMETRY BAR */

.top-line {
    top: 24px;

    padding: 13px 18px;

    background: rgba(7,12,22,0.72);

    backdrop-filter: blur(15px);

    border: 1px solid var(--line);

    color: #91a1bb;

    font-size: 9px;
    letter-spacing: 3px;

    left: 30px;
    right: 30px;

    clip-path:
        polygon(
            10px 0,
            100% 0,
            100% calc(100% - 10px),
            calc(100% - 10px) 100%,
            0 100%,
            0 10px
        );
}


/* LEVEL TAG */

.level {
    display: inline-block;

    padding: 8px 16px;

    margin-bottom: 25px;

    border: 1px solid rgba(76,201,255,0.45);

    background: rgba(76,201,255,0.07);

    color: var(--cyan);

    font-size: 9px;
    letter-spacing: 4px;

    clip-path:
        polygon(
            8px 0,
            100% 0,
            100% calc(100% - 8px),
            calc(100% - 8px) 100%,
            0 100%,
            0 8px
        );
}


/* TITLES */

h1,
h2 {
    color: white;

    text-shadow:
        0 0 35px rgba(76,201,255,0.08);
}

h1 {
    letter-spacing: -6px;
}

h1 span,
h2 span {
    color: var(--cyan);

    text-shadow:
        0 0 25px rgba(118,247,255,0.20);
}


/* TEAM */

.team {
    color: #8191ab;
}


/* TEXT */

.subtitle,
.intro {
    color: #94a1b6;
}


/* MAIN BUTTON */

.button {
    position: relative;

    border: 1px solid rgba(118,247,255,0.55);

    background:
        linear-gradient(
            110deg,
            rgba(76,201,255,0.14),
            rgba(76,201,255,0.03)
        );

    color: white;

    padding: 17px 40px;

    font-size: 10px;
    letter-spacing: 3px;

    clip-path:
        polygon(
            12px 0,
            100% 0,
            100% calc(100% - 12px),
            calc(100% - 12px) 100%,
            0 100%,
            0 12px
        );

    box-shadow:
        0 0 30px rgba(76,201,255,0.07);

    transition: 0.2s ease;
}

.button:hover {
    background: var(--cyan);

    color: #02060c;

    border-color: var(--cyan);

    box-shadow:
        0 0 30px rgba(118,247,255,0.25);

    transform: translateY(-3px);
}


/* ANSWERS / OPTIONS */

.answer,
.fuel-option,
.build-option-new {
    position: relative;

    background:
        linear-gradient(
            135deg,
            rgba(22,34,57,0.86),
            rgba(9,16,29,0.92)
        );

    border: 1px solid rgba(129,230,255,0.15);

    color: white;

    border-radius: 0;

    clip-path:
        polygon(
            10px 0,
            100% 0,
            100% calc(100% - 10px),
            calc(100% - 10px) 100%,
            0 100%,
            0 10px
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.03),
        0 12px 25px rgba(0,0,0,0.20);
}

.answer:hover,
.fuel-option:hover,
.build-option-new:hover {
    background:
        linear-gradient(
            135deg,
            rgba(38,78,110,0.72),
            rgba(14,25,44,0.95)
        );

    border-color: var(--cyan);

    color: white;

    transform: translateY(-3px);

    box-shadow:
        0 0 22px rgba(76,201,255,0.10);
}


.fuel-option:hover span {
    color: var(--cyan);
}


/* SELECTED */

.build-option-new.selected {
    border-color: var(--cyan);

    background:
        linear-gradient(
            135deg,
            rgba(76,201,255,0.20),
            rgba(14,24,40,0.95)
        );

    box-shadow:
        0 0 25px rgba(76,201,255,0.10);
}


/* INFO TELEMETRY */

.race-info {
    background: var(--panel);

    backdrop-filter: blur(16px);

    border: 1px solid var(--line);

    overflow: hidden;

    clip-path:
        polygon(
            12px 0,
            100% 0,
            100% calc(100% - 12px),
            calc(100% - 12px) 100%,
            0 100%,
            0 12px
        );
}

.race-info div {
    border-color: rgba(129,230,255,0.10);
}

.race-info span {
    color: #65728a;
}

.race-info strong {
    color: white;
}


/* CAR BOX */

.car-preview-box {
    border: 1px solid rgba(118,247,255,0.18);

    border-radius: 0;

    background:
        radial-gradient(circle at 50% 55%, rgba(76,201,255,0.12), transparent 40%),
        linear-gradient(145deg, #101827, #060a11);

    clip-path:
        polygon(
            16px 0,
            100% 0,
            100% calc(100% - 16px),
            calc(100% - 16px) 100%,
            0 100%,
            0 16px
        );

    box-shadow:
        0 30px 80px rgba(0,0,0,0.38);
}

.car-preview-box::before {
    color: #70829c;
}

.car-preview-box::after {
    color: var(--cyan);
}


/* PROGRESS */

.progress-track {
    background: #111a28;

    border: 1px solid rgba(129,230,255,0.08);

    height: 5px;
}

#build-progress-bar {
    background:
        linear-gradient(
            90deg,
            #3a8fff,
            var(--cyan)
        );

    box-shadow:
        0 0 12px rgba(118,247,255,0.35);
}


/* RESULT PANEL */

.build-final {
    background: var(--panel);

    border: 1px solid var(--line);

    clip-path:
        polygon(
            12px 0,
            100% 0,
            100% calc(100% - 12px),
            calc(100% - 12px) 100%,
            0 100%,
            0 12px
        );
}

.build-final-title {
    color: var(--cyan);
}

.build-final-item {
    background: rgba(12,20,34,0.8);

    border: 1px solid rgba(129,230,255,0.11);
}


/* FEEDBACK */

.perfect {
    color: var(--lime);
}

.danger {
    color: var(--red);
}

.warning {
    color: #ffd36c;
}


/* REWARD */

.reward {
    color: var(--lime);

    text-shadow:
        0 0 18px rgba(184,255,106,0.16);
}


/* DRIVER */

.driver {
    color: #68768c;
}

.driver strong {
    color: white;
}


/* TRACK DECORATION */

.track {
    border-color: rgba(118,247,255,0.05);

    box-shadow:
        0 0 80px rgba(76,201,255,0.025);
}

.track::before {
    border-color: rgba(118,247,255,0.035);
}


/* BOTTOM */

.bottom {
    color: #48566d;
}
        /* =========================================
   ENCRYPTED FRAGMENT SYSTEM
   ========================================= */

.data-fragment {
    position: relative;
    margin: 32px auto;
    padding: 28px 24px;
    max-width: 520px;

    background:
        linear-gradient(
            135deg,
            rgba(76, 201, 255, 0.10),
            rgba(118, 247, 255, 0.02)
        );

    border: 1px solid rgba(76, 201, 255, 0.35);

    clip-path: polygon(
        18px 0,
        100% 0,
        100% calc(100% - 18px),
        calc(100% - 18px) 100%,
        0 100%,
        0 18px
    );

    overflow: hidden;

    box-shadow:
        0 0 30px rgba(76, 201, 255, 0.10),
        inset 0 0 30px rgba(76, 201, 255, 0.03);
}

.data-fragment::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 4px,
            rgba(255,255,255,0.025) 5px
        );

    pointer-events: none;
}

.data-fragment::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;

    background: rgba(118, 247, 255, 0.8);
    box-shadow: 0 0 14px rgba(118, 247, 255, 0.8);

    animation: fragmentScan 2.4s linear infinite;
}

@keyframes fragmentScan {
    from {
        top: -5%;
    }

    to {
        top: 105%;
    }
}

.fragment-label {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.65;
}

.fragment-source {
    margin-top: 8px;
    font-size: 10px;
    letter-spacing: 2px;
    opacity: 0.4;
}

.fragment-character {
    position: relative;
    margin: 18px 0 10px;

    font-size: clamp(72px, 14vw, 120px);
    font-weight: 900;
    line-height: 1;

    color: #ffffff;

    text-shadow:
        3px 0 0 rgba(76, 201, 255, 0.7),
        -3px 0 0 rgba(255, 93, 115, 0.35),
        0 0 30px rgba(76, 201, 255, 0.65);

    animation: fragmentGlitch 2.8s infinite;
}

@keyframes fragmentGlitch {

    0%, 91%, 100% {
        transform: translate(0);
    }

    92% {
        transform: translate(-3px, 1px);
    }

    94% {
        transform: translate(4px, -1px);
    }

    96% {
        transform: translate(-2px, 0);
    }
}

.fragment-status {
    font-size: 12px;
    letter-spacing: 3px;
    color: #b8ff6a;
    text-transform: uppercase;
}

.fragment-progress {
    width: 100%;
    height: 5px;

/* ---------- SELECT OPTION ---------- */

function selectBuildOption(index) {

    const category = buildOptions[currentBuildStep];

    buildChoices[currentBuildStep] =
        category.options[index];

    // Dacă mai avem componente:
    if (currentBuildStep < buildOptions.length - 1) {

        currentBuildStep++;

        showBuildStep();

    } else {

        showBuildResult();

    }
}


/* ---------- FINAL CAR ---------- */

function showBuildResult() {

    let power = 5;
    let handling = 5;
    let braking = 5;
    let aeroScore = 5;
    let style = 5;

    buildChoices.forEach(choice => {

        if (choice.power) power = choice.power;
        if (choice.handling) handling = choice.handling;
        if (choice.braking) braking = choice.braking;

        if (choice.aero === "sport") aeroScore = 8;
        if (choice.aero === "max") aeroScore = 10;

        if (choice.name === "RACING") style = 9;
        if (choice.name === "SLICKS") style = 10;
        if (choice.name === "KRISS SPECIAL") style = 10;

    const specs = buildChoices.map((choice, index) => {

        return `

    localStorage.setItem(
        "krissFragments",
        JSON.stringify(collected)
    );
}

function showFragment(level, nextFunctionName) {
    const fragment = codeFragments[level];

    if (!fragment) {
        continueAfterFragment(nextFunctionName);
        return;
    }

    saveFragment(level);

    const collected =
        JSON.parse(localStorage.getItem("krissFragments")) || {};

    const fragmentCount = Object.keys(collected).length;
    const progress = Math.round((fragmentCount / 8) * 100);

    document.querySelector(".screen").innerHTML = `
        <div class="system-transition">

            <div class="top-line">
                <div>KRISS RACING SYSTEM</div>
                <div>ENCRYPTED CHANNEL</div>
            </div>

            <div class="registration">

                <div class="level">
                    DATA INTERCEPT
                </div>

                <div class="data-fragment">

                    <div class="fragment-label">
                        ENCRYPTED DATA DETECTED
                    </div>

                    <div class="fragment-source">
                        SOURCE // UNKNOWN
                    </div>

                    <div class="fragment-character">
                        ${fragment}
                    </div>

                    <div class="fragment-status">
                        ✓ FRAGMENT CAPTURED
                    </div>

                    <div class="fragment-progress">
                        <div style="width:${progress}%"></div>
                    </div>

                    <div class="fragment-warning">
                        DECRYPTION PROGRESS // ${progress}%
                    </div>

                </div>

                <p class="intro">
                    Store this fragment.<br>
                    Its position in the final access key is unknown.
                </p>

                <button
                    class="button"
                    onclick="continueAfterFragment('${nextFunctionName}')">
                    STORE FRAGMENT →
                </button>

            </div>

            <div class="bottom">
                SECURE CHANNEL • ${fragmentCount}/8 FRAGMENTS RECOVERED
            </div>

        </div>
    `;
}

function continueAfterFragment(nextFunctionName) {
    const nextFunction = window[nextFunctionName];

    if (typeof nextFunction === "function") {
        nextFunction();
    }
}

function verifyFinalCode() {
    const input =
        document
        .getElementById("final-code")
        .value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "");

    const feedback =
        document.getElementById("final-code-feedback");

    const fragments =
        JSON.parse(localStorage.getItem("krissFragments")) || {};

    const requiredLevels = [1, 2, 3, 5, 7, 8, 9, 10];

    const missingLevel =
        requiredLevels.find(level => !fragments[level]);

    if (missingLevel) {
        feedback.innerHTML = `
            <div class="fuel-result danger">
                OOPS.
                <small>
                    You didn't solve everything correctly.
                    Fragment data is missing.
                </small>
            </div>

            <button
                class="button"
                style="margin-top:20px;"
                onclick="restartLevel(${missingLevel})">
                RESTART LEVEL ${missingLevel}
            </button>
        `;
        return;
    }

    if (input !== "5N1P3RUL") {
        feedback.innerHTML = `
            <div class="fuel-result danger">
                ACCESS DENIED
                <small>
                    OOPS — you didn't decrypt it correctly.
                    Check your fragments and try again.
                </small>
            </div>
        `;
        return;
    }

    triggerSecurityBreach();
}
    </script>
