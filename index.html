<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kriss Racing Grand Prix</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0b0b;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .screen {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            text-align: center;
        }

        .top-line {
            position: absolute;
            top: 35px;
            left: 45px;
            right: 45px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            letter-spacing: 3px;
            color: #888;
        }

        .team {
            font-size: 14px;
            letter-spacing: 6px;
            color: #ff8700;
            font-weight: bold;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(55px, 9vw, 120px);
            line-height: 0.85;
            letter-spacing: -5px;
            font-weight: 900;
            text-transform: uppercase;
        }

        h1 span {
            color: #ff8700;
        }

        .subtitle {
            margin-top: 30px;
            font-size: 13px;
            letter-spacing: 5px;
            color: #aaa;
            text-transform: uppercase;
        }

        .driver {
            margin-top: 55px;
            font-size: 12px;
            letter-spacing: 4px;
            color: #777;
        }

        .driver strong {
            color: white;
            font-size: 18px;
            letter-spacing: 3px;
        }

        .button {
            margin-top: 40px;
            padding: 18px 45px;
            border: 1px solid #ff8700;
            background: transparent;
            color: white;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.25s;
        }

        .button:hover {
            background: #ff8700;
            color: #0b0b0b;
        }

        .bottom {
            position: absolute;
            bottom: 30px;
            font-size: 9px;
            letter-spacing: 3px;
            color: #555;
        }

        .track {
            position: absolute;
            width: 600px;
            height: 600px;
            border: 1px solid #181818;
            border-radius: 50%;
            z-index: -1;
        }

        .track::before {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            border: 1px solid #151515;
            border-radius: 50%;
            top: 89px;
            left: 89px;
        }

        /* LEVEL 0 */

        .registration {
            width: min(700px, 90%);
            text-align: center;
        }

        .level {
            color: #ff8700;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 25px;
        }

        h2 {
            font-size: clamp(45px, 7vw, 85px);
            line-height: 0.9;
            letter-spacing: -3px;
            font-weight: 900;
            text-transform: uppercase;
        }

        h2 span {
            color: #ff8700;
        }

        .intro {
            margin-top: 30px;
            color: #999;
            font-size: 14px;
            line-height: 1.8;
            letter-spacing: 1px;
        }
                #questionNumber {
            margin-top: 35px;
            margin-bottom: 20px;
            font-size: 11px;
            letter-spacing: 4px;
            color: #666;
        }

        #question {
            font-size: clamp(24px, 4vw, 42px);
            line-height: 1.15;
            letter-spacing: -1px;
            margin-bottom: 35px;
        }

        #answers {
            width: min(600px, 90%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .answer {
            padding: 18px 20px;
            border: 1px solid #333;
            background: #111;
            color: white;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
        }

        .answer:hover {
            border-color: #ff8700;
            background: #ff8700;
            color: #0b0b0b;
        }

        #feedback {
            margin-top: 25px;
            min-height: 20px;
            color: #ff4d4d;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        @media (max-width: 600px) {

            #answers {
                grid-template-columns: 1fr;
            }

            .top-line {
                left: 20px;
                right: 20px;
            }

            h2 {
                font-size: 45px;
            }

        }
                .race-info {
            width: min(650px, 90%);
            margin: 25px auto 35px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border: 1px solid #222;
            background: #101010;
        }

        .race-info div {
            padding: 16px 10px;
            border-right: 1px solid #222;
        }

        .race-info div:last-child {
            border-right: none;
        }

        .race-info span {
            display: block;
            font-size: 8px;
            letter-spacing: 2px;
            color: #666;
            margin-bottom: 8px;
        }

        .race-info strong {
            font-size: 15px;
            letter-spacing: 1px;
        }

        #fuel-options {
            width: min(650px, 90%);
            margin: 30px auto 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .fuel-option {
            padding: 20px;
            border: 1px solid #333;
            background: #111;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .fuel-option:hover {
            border-color: #ff8700;
            background: #ff8700;
            color: #0b0b0b;
            transform: translateY(-2px);
        }

        .fuel-option strong {
            display: block;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .fuel-option span {
            font-size: 9px;
            letter-spacing: 2px;
            color: #777;
        }

        .fuel-option:hover span {
            color: #0b0b0b;
        }

        #fuel-feedback {
            min-height: 100px;
            margin-top: 25px;
        }

        .fuel-result {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .fuel-result small {
            display: block;
            margin-top: 10px;
            color: #777;
            font-size: 10px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .danger {
            color: #ff4d4d;
        }

        .warning {
            color: #ff8700;
        }

        .perfect {
            color: #7cff7c;
        }

        .continue-button {
            margin-top: 25px;
        }

        .reward {
            margin-top: 35px;
            color: #ff8700;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .reward-text {
            margin-top: 12px;
            color: #666;
            font-size: 11px;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {

            .race-info {
                grid-template-columns: 1fr;
            }

            .race-info div {
                border-right: none;
                border-bottom: 1px solid #222;
            }

            .race-info div:last-child {
                border-bottom: none;
            }

            #fuel-options {
                grid-template-columns: 1fr;
            }
        }
        /* ================================
   KRISS RACING - INTERACTIVE CAR
   ================================ */

.car-build-layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 25px;
    margin-top: 25px;
}

.car-preview-box {
    position: relative;
    min-height: 380px;
    border: 1px solid #333;
    background:
        radial-gradient(circle at 50% 45%, rgba(255,135,0,0.12), transparent 45%),
        linear-gradient(145deg, #151515, #050505);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.car-preview-box::before {
    content: "KRISS RACING MACHINE #01";
    position: absolute;
    top: 18px;
    left: 20px;
    font-size: 11px;
    letter-spacing: 3px;
    color: #777;
}

.car-preview-box::after {
    content: "LIVE CONFIGURATION";
    position: absolute;
    bottom: 15px;
    right: 20px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #ff8700;
}

.car-svg {
    width: 92%;
    max-width: 850px;
    transition: all 0.35s ease;
}

.car-body {
    transition: fill 0.35s ease, filter 0.35s ease;
}

.car-window {
    fill: #080808;
    stroke: #777;
    stroke-width: 2;
}

.car-carbon {
    fill: #101010;
}

.car-light {
    fill: white;
    filter: drop-shadow(0 0 7px white);
}

.car-orange-detail {
    fill: #ff8700;
}

.car-wheel {
    transition: transform 0.35s ease;
}

.car-rim {
    fill: #171717;
    stroke: #888;
    stroke-width: 3;
}

.car-rim-inner {
    fill: none;
    stroke: #555;
    stroke-width: 3;
}

.car-brake {
    fill: #ff8700;
    transition: opacity 0.3s ease;
}

.car-spoiler {
    transition: all 0.3s ease;
}

.car-label {
    font-size: 14px;
    letter-spacing: 3px;
    fill: #fff;
    font-weight: bold;
}

.build-options-new {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.build-option-new {
    padding: 18px 10px;
    min-height: 85px;
    background: #111;
    border: 1px solid #444;
    color: white;
    cursor: pointer;
    transition: 0.2s ease;
    text-align: center;
}

.build-option-new:hover {
    border-color: #ff8700;
    transform: translateY(-2px);
}

.build-option-new.selected {
    border-color: #ff8700;
    background: rgba(255,135,0,0.12);
    box-shadow: 0 0 18px rgba(255,135,0,0.2);
}

.build-option-new strong {
    display: block;
    font-size: 15px;
    margin-bottom: 6px;
}

.build-option-new span {
    display: block;
    font-size: 10px;
    color: #999;
    letter-spacing: 1px;
}

.build-option-new.selected span {
    color: #ff8700;
}

.build-status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    font-size: 12px;
    letter-spacing: 2px;
    color: #888;
}

.build-status strong {
    color: #ff8700;
}

.build-final {
    margin-top: 20px;
    padding: 25px;
    border: 1px solid #ff8700;
    background: rgba(255,135,0,0.05);
}

.build-final-title {
    color: #ff8700;
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 15px;
}

.build-final-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.build-final-item {
    padding: 10px;
    background: #111;
    border: 1px solid #292929;
}

.build-final-item small {
    display: block;
    color: #777;
    font-size: 9px;
    letter-spacing: 2px;
    margin-bottom: 4px;
}

.build-final-item strong {
    font-size: 12px;
}

@media (max-width: 700px) {
    .build-options-new {
        grid-template-columns: repeat(2, 1fr);
    }

    .car-preview-box {
        min-height: 270px;
    }
}
        /* =====================================
   KRISS RACING — PREMIUM F1 REDESIGN
   ===================================== */

:root {
    --bg: #0a0c10;
    --panel: #11151b;
    --panel-soft: #171c23;
    --border: #2a3038;

    --text: #f4f6f8;
    --muted: #8d96a3;

    --papaya: #ff9e45;
    --papaya-soft: rgba(255, 158, 69, 0.10);

    --success: #78d6a3;
    --danger: #ff6b6b;
}


/* BODY */

body {
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.025), transparent 35%),
        radial-gradient(circle at 80% 70%, rgba(255,158,69,0.035), transparent 30%),
        var(--bg);

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    overflow-x: hidden;
    overflow-y: auto;
}


/* MAIN SCREEN */

.screen {
    padding: 90px 30px 70px;
}


/* TOP BAR */

.top-line {
    top: 28px;

    padding-bottom: 15px;

    border-bottom: 1px solid rgba(255,255,255,0.08);

    color: #727b87;

    font-size: 10px;
    letter-spacing: 2.5px;
}


/* TEAM */

.team {
    color: var(--muted);

    font-size: 11px;
    letter-spacing: 5px;

    margin-bottom: 22px;
}


/* BIG TITLES */

h1,
h2 {
    color: var(--text);
}

h1 {
    letter-spacing: -6px;
}

h2 {
    letter-spacing: -3px;
}


/* PAPAYA ONLY AS ACCENT */

h1 span,
h2 span {
    color: var(--papaya);
}


/* LEVEL LABEL */

.level {
    display: inline-block;

    color: var(--papaya);

    background: var(--papaya-soft);

    border: 1px solid rgba(255,158,69,0.25);

    padding: 8px 14px;

    border-radius: 999px;

    font-size: 9px;
    letter-spacing: 3px;

    margin-bottom: 28px;
}


/* SUBTITLE / INTRO */

.subtitle,
.intro {
    color: var(--muted);
}


/* MAIN BUTTON */

.button {
    border: 1px solid rgba(255,255,255,0.18);

    background: var(--text);

    color: #080a0d;

    padding: 17px 35px;

    border-radius: 6px;

    font-size: 10px;
    letter-spacing: 2.5px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.25);

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        border 0.2s ease;
}

.button:hover {
    background: var(--papaya);
    color: #080a0d;

    border-color: var(--papaya);

    transform: translateY(-2px);
}


/* MULTIPLE CHOICE */

.answer,
.fuel-option,
.build-option-new {

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.025),
            rgba(255,255,255,0.005)
        ),
        var(--panel);

    border: 1px solid var(--border);

    color: var(--text);

    border-radius: 8px;

    box-shadow:
        0 6px 20px rgba(0,0,0,0.12);
}


.answer:hover,
.fuel-option:hover,
.build-option-new:hover {

    background: var(--panel-soft);

    border-color: rgba(255,158,69,0.65);

    color: var(--text);

    transform: translateY(-2px);
}


.fuel-option:hover span {
    color: var(--muted);
}


/* SELECTED BUILD OPTION */

.build-option-new.selected {

    background: var(--papaya-soft);

    border-color: var(--papaya);

    box-shadow:
        inset 0 0 0 1px rgba(255,158,69,0.10),
        0 8px 25px rgba(0,0,0,0.20);
}


/* INFO PANELS */

.race-info {

    background: rgba(17,21,27,0.85);

    border: 1px solid var(--border);

    border-radius: 9px;

    overflow: hidden;

    box-shadow:
        0 10px 35px rgba(0,0,0,0.18);
}


.race-info div {
    border-color: var(--border);
}


.race-info span {
    color: #69727f;
}

.race-info strong {
    color: var(--text);
}


/* CAR PREVIEW */

.car-preview-box {

    border: 1px solid var(--border);

    border-radius: 12px;

    background:
        radial-gradient(
            circle at 50% 48%,
            rgba(255,158,69,0.07),
            transparent 38%
        ),
        linear-gradient(
            145deg,
            #151a21,
            #090c10
        );

    box-shadow:
        0 25px 60px rgba(0,0,0,0.32);
}


.car-preview-box::before {
    color: #626b77;
}


.car-preview-box::after {
    color: var(--papaya);
}


/* PROGRESS BAR */

.progress-track {

    background: #181d24;

    border-radius: 999px;

    overflow: hidden;
}

#build-progress-bar {

    background:
        linear-gradient(
            90deg,
            #d9792e,
            var(--papaya)
        );

    border-radius: 999px;
}


/* FINAL CONFIGURATION */

.build-final {

    background: rgba(17,21,27,0.9);

    border: 1px solid var(--border);

    border-radius: 10px;

    box-shadow:
        0 15px 35px rgba(0,0,0,0.18);
}


.build-final-title {
    color: var(--papaya);
}


.build-final-item {

    background: var(--panel-soft);

    border: 1px solid var(--border);

    border-radius: 6px;
}


/* FEEDBACK */

.perfect {
    color: var(--success);
}

.danger {
    color: var(--danger);
}

.warning {
    color: var(--papaya);
}


/* REWARD */

.reward {

    color: var(--papaya);

    padding: 10px 0;

    letter-spacing: 2.5px;
}


/* DRIVER */

.driver {
    color: #66707c;
}

.driver strong {
    color: var(--text);
}


/* BACKGROUND TRACK */

.track {
    border-color: rgba(255,255,255,0.035);
}

.track::before {
    border-color: rgba(255,255,255,0.025);
}


/* BOTTOM TEXT */

.bottom {
    color: #464e59;
}
    </style>
</head>

<body>

    <main class="screen">

        <div class="top-line">
            <div>KRISS RACING TEAM</div>
            <div>GRAND PRIX 2026</div>
        </div>

        <div class="track"></div>

        <div class="team">
            MCLAREN DIVISION
        </div>

        <h1>
            KRISS<br>
            <span>RACING</span>
        </h1>

        <div class="subtitle">
            Grand Prix 2026
        </div>

        <div class="driver">
            DRIVER<br><br>
            <strong>LAUR</strong>
        </div>

        <button class="button" onclick="enterPaddock()">
            ENTER PADDOCK
        </button>

        <div class="bottom">
            RACE CONTROL • DRIVER ACCESS SYSTEM
        </div>

    </main>

    <script>

        function enterPaddock() {

            document.querySelector(".screen").innerHTML = `

                <div class="top-line">
                    <div>KRISS RACING TEAM</div>
                    <div>DRIVER ACCESS</div>
                </div>

                <div class="registration">

                    <div class="level">
                        LEVEL 0
                    </div>

                    <h2>
                        DRIVER<br>
                        <span>REGISTRATION</span>
                    </h2>

                    <p class="intro">
                        Before entering the Grand Prix,<br>
                        driver identity must be verified.
                    </p>

                    <button class="button" onclick="startRegistration()">
                        BEGIN VERIFICATION
                    </button>

                </div>

                <div class="bottom">
                    RACE CONTROL • DRIVER ACCESS SYSTEM
                </div>

            `;
        }

     function startRegistration() {

    document.querySelector(".screen").innerHTML = `

        <div class="top-line">
            <div>KRISS RACING TEAM</div>
            <div>DRIVER VERIFICATION</div>
        </div>

        <div class="registration">

            <div class="level">
                LEVEL 0 • DRIVER REGISTRATION
            </div>

            <div id="questionNumber"></div>

            <h2 id="question"></h2>

            <div id="answers"></div>

            <div id="feedback"></div>

        </div>

        <div class="bottom">
            RACE CONTROL • DRIVER ACCESS SYSTEM
        </div>

    `;

    showQuestion();
}
        let currentQuestion = 0;

const questions = [
    {
        question: "Care este mașina cu care ai înnebunit-o pe Kriss?",
        answers: [
            "BMW M3",
            "Porsche 911 GT3 RS",
            "Nissan GT-R",
            "Audi R8"
        ],
        correct: 1
    },

    {
        question: "Care este marca și modelul mașinii tale actuale?",
        answers: [
            "Opel Astra",
            "Volkswagen Passat",
            "Opel Insignia",
            "BMW Seria 3"
        ],
        correct: 2
    },

    {
        question: "Care este porecla ta?",
        answers: [
            "The Driver",
            "Sniper-ul",
            "Boss",
            "Speedy"
        ],
        correct: 1
    },

    {
        question: "La ce serial te-ai uitat de cel puțin 3 ori?",
        answers: [
            "Breaking Bad",
            "Prison Break",
            "Lucifer",
            "Peaky Blinders"
        ],
        correct: 2
    },

    {
        question: "Care este unul dintre cele mai cunoscute inside joke-uri ale noastre?",
        answers: [
            "Unde e cheia?",
            "Mă doare Tomasul",
            "Hai la McDonald's",
            "Nu mai pornește mașina"
        ],
        correct: 1
    }
];

function showQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").innerHTML =
        "QUESTION " + (currentQuestion + 1) + " / " + questions.length;

    document.getElementById("question").innerHTML =
        q.question;

    const answersContainer = document.getElementById("answers");

    answersContainer.innerHTML = "";

    q.answers.forEach((answer, index) => {

        const button = document.createElement("button");

        button.className = "answer";
        button.innerHTML = answer;

        button.onclick = function() {
            checkAnswer(index);
        };

        answersContainer.appendChild(button);

    });
}

function checkAnswer(selected) {

    const q = questions[currentQuestion];

    if (selected === q.correct) {

        currentQuestion++;

        if (currentQuestion < questions.length) {

            showQuestion();

        } else {

            completeRegistration();

        }

    } else {

        document.getElementById("feedback").innerHTML =
            "✕ WRONG ANSWER — TRY AGAIN";

    }
}

function completeRegistration() {

    document.querySelector(".screen").innerHTML = `

        <div class="top-line">
            <div>KRISS RACING TEAM</div>
            <div>DRIVER VERIFIED</div>
        </div>

        <div class="registration">

            <div class="level">
                LEVEL 0 • COMPLETE
            </div>

            <h2>
                DRIVER<br>
                <span>VERIFIED ✓</span>
            </h2>

            <p class="intro">
                Identity confirmed.<br>
                Welcome to the Kriss Racing Team, Driver Laur.
            </p>

            <button class="button" onclick="goToLevel1()">
                ENTER THE GRAND PRIX
            </button>

        </div>

        <div class="bottom">
            RACE CONTROL • ACCESS GRANTED
        </div>

    `;
}

function goToLevel1() {
    
    localStorage.setItem("krissLevel", "1");

function selectBuildOption(index) {

    const category = buildOptions[currentBuildStep];

    buildChoices[currentBuildStep] =
        category.options[index];

    // Dacă mai avem componente:
    if (currentBuildStep < buildOptions.length - 1) {

        currentBuildStep++;

        showBuildStep();

    } else {

        showBuildResult();

    }
}

        if (choice.aero === "sport") aeroScore = 8;
        if (choice.aero === "max") aeroScore = 10;

        <div class="bottom">
            RACE CONTROL • LEVEL 03 CLEARED
        </div>

    `;

}


function goToLevel4() {

    localStorage.setItem("krissLevel", "4");

    document.querySelector(".screen").innerHTML = `

        <div class="top-line">
            <div>KRISS RACING TEAM</div>
            <div>GRAND PRIX 2026</div>
        </div>

        <div class="registration">

            <div class="level">
                LEVEL 4
            </div>

            <h2>
                PIT<br>
                <span>STOP</span>
            </h2>

            <p class="intro">
                Every second counts.<br>
                Prepare for the next challenge.
            </p>

            <button class="button">
                START LEVEL
            </button>

        </div>

        <div class="bottom">
            RACE CONTROL • LEVEL 04 • PIT STOP
        </div>

    `;

}
        window.addEventListener("load", function() {

    const savedLevel = localStorage.getItem("krissLevel");

    if (savedLevel === "1") {
        goToLevel1();
    }

    else if (savedLevel === "2") {
        goToLevel2();
    }

    else if (savedLevel === "3") {
        goToLevel3();
    }

    else if (savedLevel === "4") {
        goToLevel4();
    }

});
    </script>
